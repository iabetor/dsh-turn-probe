# The project is its own pnpm workspace root, so pnpm never walks up into a
# parent workspace (e.g. $HOME) when installing.
packages:
  - .

# Allow esbuild's postinstall (binary bootstrap); everything else is pure JS.
allowBuilds:
  esbuild: true

# This plugin tracks the dsh 0.1.5-rc.2 line as it is published, so the
# release-age gate stays off. Left on, a freshly published rc is silently
# skipped and the `>=0.1.2-alpha.2` peers resolve to a much older release
# instead — which is how this package ended up on 0.1.2-rc.1 while its source
# compiled against the 0.1.5 contracts. Matches dsh-hippocampus's convention.
minimumReleaseAge: 0
